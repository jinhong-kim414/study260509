<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 상 테스트 | 강아지상 vs 고양이상</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- TensorFlow.js and Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">AI <span>FACE TEST</span></div>
            <ul class="nav-links">
                <li><a href="#test">테스트하기</a></li>
                <li><a href="#partnership">제휴문의</a></li>
                <li><a href="#comments">커뮤니티</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="test" class="hero">
            <div class="hero-content">
                <h1>나는 강아지상일까,<br>고양이상일까?</h1>
                <p>인공지능이 분석하는 나의 얼굴상 테스트</p>
                
                <div class="upload-container">
                    <div id="upload-area" class="upload-area">
                        <img id="preview-image" src="" alt="Preview" style="display: none;">
                        <div id="upload-label">
                            <span class="upload-icon">📷</span>
                            <p>사진을 업로드하거나 드래그하세요</p>
                        </div>
                    </div>
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    
                    <div id="loading-spinner" style="display: none;">분석 중...</div>
                    <div id="result-container" style="display: none;">
                        <h2 id="result-message">분석 완료!</h2>
                        <div id="label-container"></div>
                        <button onclick="location.reload()" class="btn-secondary">다시 하기</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="partnership" class="category-section">
            <div class="container">
                <h2 class="section-title">제휴 문의 (Partnership)</h2>
                <p class="section-desc">AI 페이스 테스트와 함께할 파트너를 기다립니다.</p>
                <div class="form-container">
                    <form action="https://formspree.io/f/xjglajpn" method="POST" class="contact-form">
                        <div class="form-group">
                            <label for="name">성함 / 업체명</label>
                            <input type="text" id="name" name="name" required placeholder="예: 홍길동">
                        </div>
                        <div class="form-group">
                            <label for="email">이메일 주소</label>
                            <input type="email" id="email" name="_replyto" required placeholder="example@domain.com">
                        </div>
                        <div class="form-group">
                            <label for="message">문의 내용</label>
                            <textarea id="message" name="message" rows="5" required placeholder="내용을 입력해주세요."></textarea>
                        </div>
                        <button type="submit" class="btn-primary w-100">문의하기</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="comments" class="category-section dark-bg">
            <div class="container">
                <h2 class="section-title">커뮤니티 (Comments)</h2>
                <div id="disqus_thread"></div>
                <script>
                    (function() { 
                    var d = document, s = d.createElement("script");
                    s.src = "https://study260509-2.disqus.com/embed.js";
                    s.setAttribute("data-timestamp", +new Date());
                    (d.head || d.body).appendChild(s);
                    })();
                </script>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 AI Face Test. Created by Gemini CLI.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
